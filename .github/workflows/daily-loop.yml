name: Run trading loop

on:
  schedule:
    - cron: "0 21 * * 1-5"  # 21:00 UTC = 23:00 SAST, after US market close, weekdays only
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  run-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run loop
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python3 loop.py

      - name: Commit updated config
        run: |
          git config user.name "trading-loop-bot"
          git config user.email "actions@users.noreply.github.com"
          git add config.json
          git diff --quiet --cached || git commit -m "Update config after scheduled run"
          git push
